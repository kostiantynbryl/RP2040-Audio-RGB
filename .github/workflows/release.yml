name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean RP2040AudioRGB.spec
      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Force -Path dist\RP2040AudioRGB\* -DestinationPath dist\RP2040AudioRGB-portable.zip
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: cmd
        run: iscc installer.iss
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RP2040AudioRGB-Windows
          path: |
            dist/RP2040AudioRGB-portable.zip
            dist/installer/*.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/RP2040AudioRGB-portable.zip
            dist/installer/*.exe
